<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="bg-dark mb-3" style="height: 50px;">
    </div>
    <div class="d-flex gap-2 me-5 mb-3">
        <div class="text-warning d-flex justify-content-center align-items-center fs-4">Html<br> Website<br> Layout
        </div>
        <div class="d-flex flex-column  flex-fill">
            <div class="bg-danger d-flex justify-content-center align-items-center text-light mb-3"
                style="height: 75px;">
                Header
            </div>
            <div class="d-flex mb-3 gap-3 position-relative" style="height: 400px;">
                <div class="bg-primary d-flex p-3 text-light justify-content-center align-items-center">
                    Navigation
                </div>
                <div class="bg-warning d-flex flex-fill justify-content-center align-items-center">
                    Content
                </div>
                <div class="bg-success position-absolute top-0 end-0 d-flex justify-content-center align-items-center text-light w-25" style="height: 200px;">
                    Sidebar
                </div>
            </div>
            <div class="bg-info d-flex justify-content-center align-items-center text-light mb-3"
                style="height: 75px;">
                footer
            </div>
        </div>
    </div>
    <div class="bg-dark" style="height: 50px;">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
