<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .bigdiv{
            background-color: red;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            position: relative;
            padding: 25px;
        }
        .bigdiv:hover{
            background-color: brown;
        }
        .middlediv{
            background-color: blue;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            padding: 25px;  
        }
        .middlediv:hover{
            background-color: aqua;
        }
        .mindiv{
            background-color: black;
            height: 150px;
            width: 150px;
            padding: 25px;
            border-radius: 50%;
        }
        .mindiv:hover{
            background-color: white;
        }
        .mid{
            background-color: green;
            height: 100px;
            width: 100px;
            border-radius: 50%;
        }
        .mid:hover{
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="bigdiv">
        <div class="middlediv">
            <div class="mindiv">
                <div class="mid"></div>
            </div>
        </div>
    </div>
</body>
</html>
