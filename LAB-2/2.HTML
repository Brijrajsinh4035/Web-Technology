<!DOCTYPE html>
<html>

<head>
    <title>Superscript and Subscript Example</title>
</head>

<body>

    <h2 align="center">Mathematical and Chemical Expressions</h2>

    <hr>

    <h3>Mathematical Expressions</h3>

    <p>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>

    <hr>

    <h3>Chemical Expressions</h3>

    <p>Water : H<sub>2</sub>O</p>

</body>

</html>
