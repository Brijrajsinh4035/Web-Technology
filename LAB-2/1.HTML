<!DOCTYPE html>
<html>

<head>
    <title>Text Formatting Tags</title>
</head>

<body>

    <h2 align="center">Text Formatting Tags</h2>

    <p>
        <b>This text is Bold.</b>
    </p>

    <p>
        <i>This text is Italic.</i>
    </p>

    <p>
        <u>This text is Underlined.</u>
    </p>

    <p>
        <strong>This text is Strong (Important).</strong>
    </p>

    <p>
        <em>This text is Emphasized.</em>
    </p>

    <hr>

    <h3>Combined Formatting</h3>

    <p>
        <b><i><u>Bold + Italic + Underline</u></i></b>
    </p>

    <p>
        <strong><em>Strong + Emphasized</em></strong>
    </p>

</body>

</html>
