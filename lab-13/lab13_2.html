<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="d-flex justify-content-center align-items-center" style="height: 100vh;">

        <div class="card text-dark bg-light d-flex justify-content-center align-items-center p-4" style="width: 350px;">
            <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo-shadow.png" class="card-img-top"

                <h3 class="card-title text-center">Please sign in</h3>

                    <input type="text" class="form-control" placeholder="Username" aria-label="Username"
                        aria-describedby="basic-addon1">
                </div>
                <div class="input-group">
                    <input type="password" class="form-control" placeholder="Password" aria-label="Password"

                 <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">

            </div>

            <div class="d-grid col-12 mb-4">
