<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <input type="text" id="question" placeholder="Enter value">
    <br>

    <button id="clean">AC</button>
    <button class="number" data-value="7">7</button>
    <button class="number" data-value="8">8</button>
    <button class="number" data-value="9">9</button>
    <br>

    <button class="number" data-value="+">+</button>
    <button class="number" data-value="4">4</button>
    <button class="number" data-value="5">5</button>
    <button class="number" data-value="6">6</button>
    <br>

    <button class="number" data-value="-">-</button>
    <button class="number" data-value="1">1</button>
    <button class="number" data-value="2">2</button>
    <button class="number" data-value="3">3</button>
    <br>

    <button class="number" data-value="*">*</button>
    <button class="number" data-value="/">/</button>
    <button class="number" data-value="%">%</button>
    <button id="backspace">&lt;</button>
    <button id="answer">=</button>

    <script>
        const question = document.getElementById("question");
        const clean = document.getElementById("clean");
        const answer = document.getElementById("answer");
        const backspace = document.getElementById("backspace");
        const buttons = document.querySelectorAll(".number");

        buttons.forEach((button)=>{
            button.addEventListener('click',()=>{
                question.value += button.dataset.value;
            })
        })

        clean.addEventListener("click", function() {
            question.value = "";
        });

        backspace.addEventListener("click", function() {
            question.value = question.value.slice(0, -1);
        });

        answer.addEventListener("click", function() {
            try {
                if (question.value.trim() === "") {
                    return;
                }

                const result = eval(question.value);

                if (typeof result !== "number" ||
                    !Number.isFinite(result)) {
                    question.value = "Error";
                    return;
                }

                question.value = result;
            } catch (error) {
                question.value = "Error";
            }
        });
    </script>
</body>
</html>
