<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="answer"></p>
    <script>
        var n = Number(prompt("Enter Number"));
        var ans = document.getElementById("answer");

        for(let i=1;i<=n;i++){
            if(n%i==0){
                ans.innerHTML += `${i} <br>`; 
            }
        }
    </script>
</body>
</html>
