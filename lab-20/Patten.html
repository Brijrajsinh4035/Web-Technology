<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="ans"></p>
    <p id="ans2"></p>
    <script>
        var n = Number(prompt("Enter Number"));
        var ans = document.getElementById("ans");
        var ans2 = document.getElementById("ans2");
        for (let i = 0; i < n; i++) {
            for (let j = 0; j <= i; j++) {
                ans.innerText += `*`;
            }
            ans.innerHTML += "<Br>";
        }

        for (let i = 0; i < n; i++) {
            for (let j = 0; j <= i; j++) {
                ans2.innerText += `${(j+1)}`;
            }
            ans2.innerHTML += "<Br>";
        }


    </script>
</body>

</html>
