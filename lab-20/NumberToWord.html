<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        var n = Number(prompt("Enter Number"));

        if(n===NaN){
            document.write('Not A Number');
        }else{
            if(n<0 || n>999){
                document.write("Out Of Range");
            }
            else{
                var rem=0,rev=0,temp=n,i=0;
                while(n>0){
                    rem = n%10;
                    rev = rem + rev * 10;
                    n = parseInt(n/10);
                }
                console.log(rev);
                var word = ["zero","one","two","three","four","five","six","seven","eight","nine"];
                var w=[];
                console.log(word[rem]);
                while(rev>0){
                    rem = rev % 10;
                    console.log(word[rem]);
                    w[i] = `${word[rem]}  ${" "}`;
                    rev = parseInt(rev/10);
                    i++;
                }

                const clean = w.map((i)=> i.replace(/,/g, ""));

                document.write(clean.join(" "));
            }
        }
    </script>
</body>

</html>
