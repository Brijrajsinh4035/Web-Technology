<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n = Number(prompt("Enter Number"));
        var arr = [];
        var i = 0;
        while(n>0){
            arr[i] = n%10;
            n=parseInt(n/10);
            i++;
        }   
        var pow = Math.pow(arr[1],arr[0]);
        document.write(`power = ${pow}`);
        
    </script>
</body>
</html>
