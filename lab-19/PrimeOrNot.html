<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="answer"></p>
    <script>
        let answer = document.getElementById("answer");
        let n = Number(prompt("Enter Number"));
        if(n<2) answer.innerText = "Number is prime";
        var flag = 0;
        for(var i = 2;i <= Math.sqrt(n);i++){
            if(n%i==0){
                flag = 1;
                break;
            }
        }
        if(flag===1){
            answer.innerText = `${n} Number is not prime`;
        }else{
            answer.innerText = `${n} Number is prime`;
        }
    </script>
</body>
</html>
