<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="answer"></p>
    <script>
        var answer = document.getElementById("answer");
        var n = Number(prompt("enter number"));
        var a=1; 
        for(let i = 1;i<=n;i++){
             a = i*a;
        }
        answer.innerText = `${n} Number factorial is ${a}`;
    </script>
</body>
</html>
