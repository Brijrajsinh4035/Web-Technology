<!DOCTYPE html>
<html>
  <head>
    <title>HTML List Controls</title>
  </head>
  <body>
    <h2>Unordered List</h2>
    <ul type="square">
      <li>Coffee</li>
      <li>Tea</li>
      <li>Milk</li>
      <ul type="round">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
      </ul>
    </ul>

    <hr />

    <h2>Ordered List</h2>

    <ol type="A" start="5">
      <li>First Step (E)</li>
      <li>Second Step (F)</li>
      <li>Third Step (G)</li>
      <ol type="1" start="5">
        <li>First Step (5)</li>
        <li>Second Step (6)</li>
        <li>Third Step (7)</li>
      </ol>
    </ol>

    <hr>
    <h2>Data Defination</h2>
    <dl>
        <dt>HTML</dt>
        <DD>Hyper text markup Language</DD>
    </dl>
  </body>
</html>
