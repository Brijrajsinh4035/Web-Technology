<!DOCTYPE html>
<html>
<head>
    <title>iFrame Example</title>
</head>
<body>

    <h2>My Webpage</h2>
    <p>Below is another website displayed inside an iframe:</p>

    <iframe 
        src="https://www.wikipedia.org" 
        width="100%" 
        height="400" 
        title="Wikipedia Homepage"
        style="border: 2px solid black;">
    </iframe>

    <h2>My Image</h2>
    <p>Below is image in iframe:</p>

    <iframe 
        src="https://thumbs.dreamstime.com/b/beautiful-rain-forest-ang-ka-nature-trail-doi-inthanon-national-park-thailand-44947671.jpg" 
        width="100%" 
        height="400" 
        title="Wikipedia Homepage"
        style="border: 2px solid black;">
    </iframe>

    <h2>My Video</h2>
    <p>Below is video in iframe:</p>

    <iframe 
        src="https://commons.wikimedia.org/wiki/File:2.3_Tour_of_Wikipedia_Articles.webm" 
        width="100%" 
        height="400" 
        title="Wikipedia Homepage"
        style="border: 2px solid black;">
    </iframe>
    

</body>
</html>
