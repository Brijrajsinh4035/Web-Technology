<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <p>display text</p>
    <p id="p1"></p>
    <button id="b1">click</button>

    <script>
        $(document).ready(()=>{
            var display=false;
            $('#b1').click(()=>{
                if(display){
                    $('#p1').text("");
                    display=false;
                }else{
                $('#p1').text("button was click");
                    display = true;
            }
            })
        })
    </script>
</body>
</html>
