
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="qu" name="ans">
    <button id="ans">Submit</button>
    <p id="re"></p>

    <script>
        var a = document.getElementById("ans");
        
        a.addEventListener('click',()=>{
            var q = document.getElementById("qu").value;
            console.log(q);
            var arr = q.split(",");
            console.log(arr);

            arr = arr.sort((a,b)=>a-b);
            var r = document.getElementById("re");
            r.innerHTML = arr;
        })
    </script>
</body>
</html>
