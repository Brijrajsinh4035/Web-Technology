<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab5-3</title>
</head>
<body>
    <form>
        <table>
            <caption>Create Account</caption>
            <tr>
                <td>First name*</td>
                <td>Last name</td>
            </tr>
            <tr>
                <td><input type="text" required placeholder="Enter your first name"></td>
                <td><input type="text" placeholder="Enter your last name"></td>
            </tr>
            <tr>
                <td colspan="2">Email*</td>
            </tr>
            <tr>
                <td colspan="2"><input type="email" required placeholder="enter Your Email"></td>
            </tr>
            <tr>
                <td>Password*</td>
                <td>Confirm Password*</td>
            </tr>
            <tr>
                <td><input type="password" required placeholder="Enter your password"></td>
                <td><input type="password" placeholder="Enter your password again"></td>
            </tr>
        </table>
    </form>
</body>
</html>
