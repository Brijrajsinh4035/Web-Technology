<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get" >
        <table align="Center">
            <caption style="font-size: 25PX;">COVID-19 Vaccine Registration Form</caption>
            <tr>
                <td>First Name</td>
                <td><input type="text" id="fname"></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" id="lname"></td>
            </tr>
            <tr>
                <td>Aadhar Number</td>
                <td><input type="number" maxlength="12"></td>
            </tr>
            <tr>
                <td>Vaccine Name</td>
                <td>
                    <select name="Vaccine" id="Vaccine">
                        <option value="">please select vaccine name</option>
                        <option value="1">1</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Vaccination Center Name</td>
                <td>
                    <select name="vplace" id="vplace">
                        <option value="">Please Select Vaccination Center Name</option>
                        <option value="1">1</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Date of Dose</td>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td>Dose Number</td>
                <td>
                    <input type="number" max="3" min="1">
                </td>
            </tr>
            <tr align="Center">
                <td colspan="2">
                    <input type="submit" placeholder="CLICK HERE"></input>
                    <INPUT type="reset" title="CANCEL"></INPUT>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
